services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  image-service:
    build:
      context: .
      dockerfile: services/image-service/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  colorimetry-service:
    build:
      context: .
      dockerfile: services/colorimetry-service/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  result-service:
    build:
      context: .
      dockerfile: services/result-service/Dockerfile
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-urine_strip_demo}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      PORT: 8080
      IMAGE_SERVICE_URL: ${IMAGE_SERVICE_URL:-http://image-service:8000}
      COLORIMETRY_SERVICE_URL: ${COLORIMETRY_SERVICE_URL:-http://colorimetry-service:8001}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8002}
      RESULT_SERVICE_URL: ${RESULT_SERVICE_URL:-http://result-service:8003}
    depends_on:
      image-service:
        condition: service_healthy
      colorimetry-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      result-service:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8088}
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mongo-data:
